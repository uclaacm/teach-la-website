# docker-compose.yml

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: local_backend
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  next_frontend:
    build: 
      context: ./next-frontend
      dockerfile: Dockerfile
    container_name: local_nextjs
    environment:
      - API_URL=http://backend:4000/api
      - NEXT_PUBLIC_API_URL=/api 
    depends_on:
      - backend
    volumes:
      - ./next-frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: local_proxy
    ports:
      # Binds port 80 directly to Nginx
      - "80:80"
      - "443:443"
    depends_on:
      - next_frontend
      - backend

volumes:
  mongo_data: